<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Offline — ANYFREEBOOK</title>
<meta name="theme-color" content="#6366f1"/>
<link rel="icon" href="/favicon.ico"/>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f8fafc; color: #0f172a;
  }
  .card {
    width: 100%; max-width: 30rem; text-align: center;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 1.25rem;
    padding: 2.5rem 1.75rem; box-shadow: 0 20px 45px -25px rgba(15, 23, 42, .45);
  }
  .mark {
    width: 4.5rem; height: 4.5rem; margin: 0 auto 1.5rem;
    border-radius: 1rem;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 52%, #d946ef 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 2rem; height: 2rem; }
  h1 { margin: 0 0 .5rem; font-size: 1.5rem; line-height: 1.25; letter-spacing: -.02em; }
  p { margin: 0 0 1.5rem; color: #475569; font-size: .95rem; line-height: 1.6; }
  .actions { display: flex; flex-direction: column; gap: .625rem; }
  button, a.link {
    display: block; width: 100%; padding: .75rem 1rem;
    border-radius: .75rem; font: inherit; font-weight: 600; font-size: .95rem;
    cursor: pointer; text-decoration: none; border: 1px solid transparent;
  }
  button {
    background: linear-gradient(135deg, #6366f1 0%, #d946ef 100%);
    color: #fff; border: none;
  }
  button:active { transform: translateY(1px); }
  a.link { background: #fff; color: #4f46e5; border-color: #e2e8f0; }
  .note { margin-top: 1.5rem; font-size: .8rem; color: #94a3b8; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #f1f5f9; }
    .card { background: #1e293b; border-color: #334155; box-shadow: none; }
    p { color: #cbd5e1; }
    a.link { background: #1e293b; color: #a5b4fc; border-color: #334155; }
    .note { color: #64748b; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 0 0 5H20"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      ANYFREEBOOK needs a connection to search the open-access libraries and
      stream books. Pages you've already opened are still available offline.
    </p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Try again</button>
      <a class="link" href="/">Go to the homepage</a>
    </div>
    <p class="note">The service worker will reconnect automatically once you're back online.</p>
  </main>
  <script>
    // Reconnect as soon as the network returns.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
