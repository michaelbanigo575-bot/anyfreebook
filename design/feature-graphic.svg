<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-label="ANYFREEBOOK — free books for every profession">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="52%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#brand)"/>

  <!-- soft glow -->
  <circle cx="880" cy="70" r="210" fill="#ffffff" opacity="0.07"/>
  <circle cx="90" cy="470" r="180" fill="#ffffff" opacity="0.06"/>

  <!-- app mark -->
  <g transform="translate(96 138)">
    <rect width="132" height="132" rx="30" fill="#ffffff" opacity="0.16"/>
    <g transform="translate(66 66) scale(3.1) translate(-12 -14.5)"
       fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 0 0 5H20"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="264" y="196" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="-1">ANYFREEBOOK</text>
  <text x="266" y="243" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#ffffff" opacity="0.88">Free books for every profession</text>

  <!-- divider -->
  <rect x="266" y="278" width="96" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>

  <text x="266" y="322" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#ffffff" opacity="0.82">5M+ free books &amp; papers &#183; live results from 7 open-access sources</text>

  <!-- badges -->
  <g transform="translate(266 348)">
    <rect width="86" height="38" rx="19" fill="#10b981"/>
    <text x="43" y="25" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.5">FREE</text>
  </g>
  <g transform="translate(366 348)">
    <rect width="196" height="38" rx="19" fill="#ffffff" opacity="0.16"/>
    <text x="98" y="25" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.8">VERIFIED LEGAL</text>
  </g>
  <g transform="translate(576 348)">
    <rect width="180" height="38" rx="19" fill="#ffffff" opacity="0.16"/>
    <text x="90" y="25" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.8">NO SIGN-UP</text>
  </g>

  <text x="266" y="442" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff" opacity="0.9" letter-spacing="2.5">ANYFREEBOOK.COM</text>
</svg>
